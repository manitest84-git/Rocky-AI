name: rocky

services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: rocky_db
      POSTGRES_USER: rocky_admin
      POSTGRES_PASSWORD: rocky_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocky_admin -d rocky_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8333:8333"
    env_file:
      - .env
    environment:
      # Ollama & LiveKit run on local machine via Tailscale
      - OLLAMA_BASE_URL=http://100.125.118.104:11434
      - LIVEKIT_URL=ws://100.125.118.104:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./agent:/app
    environment:
      # Ollama & LiveKit run on local machine via Tailscale
      - LIVEKIT_URL=ws://100.125.118.104:7880
      - OLLAMA_BASE_URL=http://100.125.118.104:11434
      - PIPER_TTS_URL=http://100.125.118.104:5000
    depends_on:
      - postgres
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-3000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
      - ./frontend/out:/var/www/frontend:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
