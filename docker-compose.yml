name: rocky

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit-server:
    image: livekit/livekit-server:latest
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "50000-50050:50000-50050/udp"
    environment:
      - NODE_IP=${LIVEKIT_NODE_IP:-192.168.0.100}
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: --config /livekit.yaml --node-ip ${LIVEKIT_NODE_IP:-192.168.0.100}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: rocky_db
      POSTGRES_USER: rocky_admin
      POSTGRES_PASSWORD: rocky_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rocky_admin -d rocky_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8333:8333"
    env_file:
      - .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - LIVEKIT_URL=ws://livekit-server:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
      livekit-server:
        condition: service_started
    restart: unless-stopped

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - ./agent:/app
    environment:
      - LIVEKIT_URL=ws://livekit-server:7880
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
      - livekit-server
      - postgres
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    ports:
      - "${GATEWAY_PORT:-3000}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/html:/usr/share/nginx/html:ro
      - ./frontend/out:/var/www/frontend:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
      livekit-server:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_models:
  postgres_data:
